<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassino Virtual - Roleta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-text { text-shadow: 0 0 10px #fbbf24, 0 0 20px #f59e0b; }
        .neon-box { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); border: 2px solid #fbbf24; }
        .roulette-red { background-color: #dc2626; }
        .roulette-black { background-color: #111827; }
        .roulette-green { background-color: #16a34a; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    
    <div class="max-w-4xl w-full flex flex-col items-center">
        <h1 class="text-5xl font-bold text-yellow-400 mb-8 neon-text tracking-wider">ROLETA EUROPEIA</h1>
        
        <div class="bg-gray-800 p-8 rounded-2xl neon-box w-full mb-8 flex flex-col md:flex-row gap-8 items-center justify-center">
            <!-- Roda da Roleta (Representação) -->
            <div class="w-48 h-48 rounded-full border-8 border-yellow-600 flex items-center justify-center relative shadow-[0_0_30px_rgba(245,158,11,0.5)]">
                <div class="absolute w-full h-full rounded-full border-4 border-dashed border-gray-300 animate-[spin_10s_linear_infinite]"></div>
                <div class="text-3xl font-bold z-10 text-white">0</div>
            </div>

            <!-- Mesa de Apostas Simples -->
            <div class="grid grid-cols-2 gap-2 w-full md:w-1/2">
                <button class="roulette-red text-white py-4 font-bold rounded shadow hover:opacity-80">VERMELHO</button>
                <button class="roulette-black border border-gray-600 text-white py-4 font-bold rounded shadow hover:opacity-80">PRETO</button>
                <button class="col-span-2 border border-yellow-500 text-yellow-400 py-4 font-bold rounded shadow hover:bg-yellow-500 hover:text-black transition-colors">
                    FAZER APOSTA (R$ 50)
                </button>
            </div>
        </div>

        <a href="http://127.0.0.1" class="text-gray-400 hover:text-yellow-400 transition-colors underline decoration-dashed">
            &larr; Voltar ao Lobby Principal
        </a>
    </div>

</body>
</html>
