<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassino Virtual - Blackjack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neon-text { text-shadow: 0 0 10px #fbbf24, 0 0 20px #f59e0b; }
        .neon-box { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); border: 2px solid #fbbf24; }
        .card { width: 80px; height: 120px; border-radius: 8px; background-color: white; color: black; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border: 1px solid #ccc; }
        .card-hidden { background: repeating-linear-gradient(45deg, #1f2937, #1f2937 10px, #111827 10px, #111827 20px); border-color: #374151; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    
    <div class="max-w-3xl w-full flex flex-col items-center">
        <h1 class="text-5xl font-bold text-yellow-400 mb-8 neon-text tracking-wider">BLACKJACK</h1>
        
        <div class="bg-green-900 p-8 rounded-2xl neon-box w-full mb-8 flex flex-col items-center shadow-2xl relative overflow-hidden">
            <!-- Dealer -->
            <div class="mb-8 w-full">
                <h3 class="text-yellow-400 mb-2 text-center uppercase tracking-widest text-sm">Cartas do Dealer</h3>
                <div class="flex justify-center space-x-2">
                    <div class="card card-hidden shadow-lg"></div>
                    <div class="card shadow-lg"><span class="text-red-600">Q♥</span></div>
                </div>
            </div>

            <!-- Jogador -->
            <div class="mb-8 w-full">
                <h3 class="text-yellow-400 mb-2 text-center uppercase tracking-widest text-sm">Suas Cartas (Total: 19)</h3>
                <div class="flex justify-center space-x-2">
                    <div class="card shadow-lg">9♠</div>
                    <div class="card shadow-lg"><span class="text-red-600">10♦</span></div>
                </div>
            </div>

            <!-- Ações -->
            <div class="flex space-x-4">
                <button class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-2 px-6 rounded-full transition-colors">COMPRAR (HIT)</button>
                <button class="bg-gray-800 hover:bg-gray-700 border border-gray-500 text-white font-bold py-2 px-6 rounded-full transition-colors">PARAR (STAND)</button>
            </div>
        </div>

        <a href="http://127.0.0.1" class="text-gray-400 hover:text-yellow-400 transition-colors underline decoration-dashed">
            &larr; Voltar ao Lobby Principal
        </a>
    </div>

</body>
</html>
